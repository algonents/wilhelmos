# Compiled-in Terminus 16x32 as the fbcon font (selected via
# fbcon=font:TER16x32 on the kernel cmdline, see the wks bootloader
# append). The userspace path (vconsole.conf + udev re-trigger) cannot
# survive the SimpleDRM -> native driver fbcon takeover: the vtcon
# re-registers with the kernel built-in 8x16 font (unreadable on
# high-DPI panels) and systemd-vconsole-setup cannot copy fonts across
# VTs while the kiosk VT is in graphics mode (KD_FONT_OP_GET fails).
# A compiled-in default is immune to the handover.
CONFIG_FONTS=y
CONFIG_FONT_TER16x32=y
# With CONFIG_FONTS=y the 8x16 default is no longer implicit; keep it as
# the fallback for drivers that reject 16x32.
CONFIG_FONT_8x16=y
