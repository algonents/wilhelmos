# GPU/DRM support for bare-metal targets.
# Native Intel iGPU drivers (Arrow Lake may bind to i915 or xe on 6.18)
CONFIG_DRM_I915=m
CONFIG_DRM_XE=m
# AMD iGPU support for future targets (firmware not yet installed)
CONFIG_DRM_AMDGPU=m
# Generic UEFI-GOP KMS fallback so the compositor finds a /dev/dri/card*
# even when no native driver binds (unaccelerated, llvmpipe-rendered)
CONFIG_DRM_SIMPLEDRM=y
CONFIG_SYSFB_SIMPLEFB=y
# MEI GSC proxy component for MTL/ARL iGPUs; without it i915 logs
# "GT1: GSC proxy handler failed to init" (content-protection/firmware
# handshake path, not needed for display or GL, but keep dmesg clean)
CONFIG_INTEL_MEI=m
CONFIG_INTEL_MEI_ME=m
CONFIG_INTEL_MEI_GSC_PROXY=m
